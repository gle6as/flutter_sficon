name: flutter_sficon
description: "SF Symbols 27 as tree-shakable vector icons on every platform, with all weights. No bundled font, so iOS builds pass Apple's font check."
version: 2.0.0
repository: https://github.com/gle6as/flutter_sficon

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

